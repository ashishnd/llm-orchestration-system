[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-orchestrator"
version = "0.1.0"
description = "Real-time multi-agent LLM orchestration with self-improving evaluation loop"
requires-python = ">=3.11"
dependencies = [
    # API + streaming
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "sse-starlette==2.1.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    # LLM
    "openai==1.54.0",
    "tiktoken==0.8.0",
    # RAG (LangChain only for utilities: splitters, loaders)
    "langchain-text-splitters==0.3.0",
    "langchain-community==0.3.1",
    "chromadb==0.5.15",
    "arxiv==2.1.3",
    # Persistence
    "sqlalchemy==2.0.35",
    "greenlet>=3.0.3",
    "psycopg[binary]==3.2.3",
    "alembic==1.13.3",
    # Background worker
    "redis==5.1.1",
    "rq==2.0.0",
    # Misc
    "structlog==24.4.0",
    "httpx==0.27.2",
    # langchain-community 0.3.x requires tenacity <9; chromadb needs >=8.2.3
    "tenacity>=8.2.3,<9,!=8.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.7.0",
    "respx==0.21.1",
    "aiosqlite==0.20.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI uses Depends(...) in route defaults by design.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers -m \"not live_llm\""
markers = [
    "live_llm: calls the real OpenAI API (set RUN_LIVE_LLM=1 and OPENAI_API_KEY)",
]

# Only ship the `app` package. `data/` is corpus assets, not Python code —
# without this, editable installs fail with "Multiple top-level packages".
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*", "scripts*"]
